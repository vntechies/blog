    <path d="M365 705 H410" stroke="#a89984" stroke-width="3" />
    <rect x="410" y="662" width="645" height="76" rx="12" fill="#ebdbb2" />
    <text x="435" y="691" font-size="22" font-weight="700">Troubleshooting</text>
    <text x="435" y="718" font-size="19">Yêu cầu · ngữ cảnh · quyền</text>
