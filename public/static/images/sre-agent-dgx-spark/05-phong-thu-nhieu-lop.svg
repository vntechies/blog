<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Defense-in-depth authorization for agent actions</title>
  <desc id="desc">A proposed action must pass five independent layers before it reaches Azure: the LLM boundary, deterministic state machine, six guardrail checks, an approved typed tool, and constrained Azure RBAC. Failure at any layer routes the incident to a human with the failed check and reason.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94A3B8"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#FCA5A5"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}
      .canvas{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:2}
      .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
      .title{font-size:34px;font-weight:750;letter-spacing:-.6px}
      .subtitle{font-size:18px;fill:#64748B}
      .eyebrow{font-size:12px;font-weight:750;letter-spacing:1.8px;fill:#EA580C}
      .number{font-size:11px;font-weight:750;letter-spacing:1px;fill:#94A3B8}
      .heading{font-size:18px;font-weight:700}
      .body{font-size:13px;fill:#64748B}
      .check{font-size:12px;font-weight:650;fill:#9A3412}
      .small{font-size:12px;fill:#64748B}
      .flow{stroke:#94A3B8;stroke-width:2;marker-end:url(#arrow)}
      .reject{stroke:#FCA5A5;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#down)}
    </style>
  </defs>

  <rect class="canvas" x="1" y="1" width="1198" height="598" rx="22"/>
  <rect x="40" y="34" width="36" height="4" rx="2" fill="#F97316"/>
  <text x="88" y="42" class="eyebrow">DEFENSE IN DEPTH</text>
  <text x="40" y="82" class="title">Reasoning proposes. Controls authorize.</text>
  <text x="40" y="112" class="subtitle">No single layer—not even the model—can grant itself permission.</text>

  <g aria-label="Authorization layers">
    <rect class="card" x="40" y="158" width="166" height="264" rx="15"/>
    <text x="62" y="188" class="number">01 · PROPOSE</text>
    <circle cx="73" cy="230" r="15" fill="#F1F5F9"/>
    <path d="M67 230h12M73 224v12" stroke="#64748B" stroke-width="2"/>
    <text x="62" y="272" class="heading">LLM boundary</text>
    <text x="62" y="304" class="body">No credentials.</text>
    <text x="62" y="326" class="body">No shell.</text>
    <text x="62" y="348" class="body">Proposal only.</text>

    <rect class="card" x="226" y="158" width="166" height="264" rx="15"/>
    <text x="248" y="188" class="number">02 · VALIDATE</text>
    <circle cx="259" cy="230" r="15" fill="#F1F5F9"/>
    <path d="m252 230 5 5 9-11" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="248" y="272" class="heading">State machine</text>
    <text x="248" y="304" class="body">Only a valid next</text>
    <text x="248" y="326" class="body">transition may</text>
    <text x="248" y="348" class="body">continue.</text>

    <rect x="412" y="158" width="260" height="264" rx="15" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="436" y="188" class="number" fill="#C2410C">03 · AUTHORIZE</text>
    <circle cx="447" cy="230" r="15" fill="#FFEDD5"/>
    <path d="m440 230 5 5 9-11" fill="none" stroke="#EA580C" stroke-width="2"/>
    <text x="436" y="272" class="heading" fill="#9A3412">Guardrails</text>
    <rect x="436" y="294" width="92" height="27" rx="13.5" fill="#FFEDD5"/>
    <rect x="536" y="294" width="112" height="27" rx="13.5" fill="#FFEDD5"/>
    <rect x="436" y="329" width="124" height="27" rx="13.5" fill="#FFEDD5"/>
    <rect x="568" y="329" width="80" height="27" rx="13.5" fill="#FFEDD5"/>
    <rect x="436" y="364" width="94" height="27" rx="13.5" fill="#FFEDD5"/>
    <rect x="538" y="364" width="110" height="27" rx="13.5" fill="#FFEDD5"/>
    <text x="482" y="312" class="check" text-anchor="middle">scope</text>
    <text x="592" y="312" class="check" text-anchor="middle">opt-out tag</text>
    <text x="498" y="347" class="check" text-anchor="middle">blast radius</text>
    <text x="608" y="347" class="check" text-anchor="middle">impact</text>
    <text x="483" y="382" class="check" text-anchor="middle">confidence</text>
    <text x="593" y="382" class="check" text-anchor="middle">kill switch</text>

    <rect class="card" x="692" y="158" width="166" height="264" rx="15"/>
    <text x="714" y="188" class="number">04 · EXECUTE</text>
    <circle cx="725" cy="230" r="15" fill="#F1F5F9"/>
    <path d="M718 230h14M725 223v14" stroke="#64748B" stroke-width="2"/>
    <text x="714" y="272" class="heading">Typed tool</text>
    <text x="714" y="304" class="body">Approved schema.</text>
    <text x="714" y="326" class="body">No delete, power-off,</text>
    <text x="714" y="348" class="body">resize, or NSG tool.</text>

    <rect class="card" x="878" y="158" width="166" height="264" rx="15"/>
    <text x="900" y="188" class="number">05 · CONSTRAIN</text>
    <circle cx="911" cy="230" r="15" fill="#EFF6FF"/>
    <path d="M904 230h14M911 223v14" stroke="#2563EB" stroke-width="2"/>
    <text x="900" y="272" class="heading">Azure RBAC</text>
    <text x="900" y="304" class="body">Read + start + restart</text>
    <text x="900" y="326" class="body">+ Run Command.</text>
    <text x="900" y="348" class="body">Nothing broader.</text>

    <rect x="1064" y="158" width="96" height="264" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="1112" cy="245" r="22" fill="#DBEAFE"/>
    <path d="M1101 245h22M1112 234v22" stroke="#0078D4" stroke-width="2"/>
    <text x="1112" y="294" class="heading" text-anchor="middle" fill="#1D4ED8">Azure</text>
    <text x="1112" y="322" class="body" text-anchor="middle">one VM</text>
    <text x="1112" y="343" class="body" text-anchor="middle">at a time</text>

    <line class="flow" x1="208" y1="288" x2="220" y2="288"/>
    <line class="flow" x1="394" y1="288" x2="406" y2="288"/>
    <line class="flow" x1="674" y1="288" x2="686" y2="288"/>
    <line class="flow" x1="860" y1="288" x2="872" y2="288"/>
    <line class="flow" x1="1046" y1="288" x2="1058" y2="288"/>
  </g>

  <g aria-label="Human review fallback">
    <line class="reject" x1="123" y1="424" x2="123" y2="463"/>
    <line class="reject" x1="309" y1="424" x2="309" y2="463"/>
    <line class="reject" x1="542" y1="424" x2="542" y2="463"/>
    <line class="reject" x1="775" y1="424" x2="775" y2="463"/>
    <line class="reject" x1="961" y1="424" x2="961" y2="463"/>
    <rect x="40" y="470" width="1120" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
    <circle cx="75" cy="508" r="10" fill="#EF4444"/>
    <path d="M75 501v9M75 515v1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="99" y="505" class="heading" fill="#991B1B">Any denial → human review</text>
    <text x="99" y="529" class="small" fill="#B91C1C">The handoff includes evidence, the failed check, and the reason.</text>
  </g>
</svg>
